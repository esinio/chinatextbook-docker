server {
    listen 80;
    server_name localhost;

    # 根目录指向 Dockerfile 中复制过来的静态文件位置
    root /usr/share/nginx/html;
    index index.html;

    # 开启 Gzip 压缩，减少传输体积
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # 针对 Next.js 的静态资源目录（如 JS、CSS、字体、图片）设置长时间缓存
    # 注意：Next.js 构建出的静态资源文件名自带 hash，所以可以放心设置 immutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 针对图片或其他公共静态资源设置缓存
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000";
    }

    # 核心：处理 SPA 路由回退
    # 尝试按顺序查找：文件 -> 目录 -> 加上 .html 后缀的文件 -> 回退到 index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
